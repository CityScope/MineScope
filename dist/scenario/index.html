<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="referrer" content="no-referrer">
  <title>MineScope — Scenario table</title><meta name="description" content="Move a tailings piece on a printed terrain model and explore real-time trade-offs.">
  <script src="../session.js?v=20261008-sync1"></script>
  <script src="table-config.js?v=20261007-service1"></script>
  <script src="../unity-config.js?v=20261008-views1"></script>
  <link rel="stylesheet" href="../view-menu.css?v=20261008-views3">
  <script src="../view-menu.js?v=20261008-sync1" defer></script>
  <link rel="stylesheet" href="style.css?v=20261008-views2">

</head>
<body data-app-view="table">
  <svg class="icon-library" aria-hidden="true"><defs>
    <symbol id="i-water" viewBox="0 0 24 24"><path d="M12 2C10 6 5 10 5 15a7 7 0 0 0 14 0c0-5-5-9-7-13Z"/><path d="M8 15a4 4 0 0 0 4 4"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M21 3C9 2 3 7 4 14s12 8 17-11Z"/><path d="m3 22 13-13"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M6 21v-3a6 6 0 0 1 12 0v3ZM3 9a3 3 0 0 0 0 6M21 9a3 3 0 0 1 0 6M1 22v-3m22 3v-3"/></symbol>
    <symbol id="i-fund" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></symbol>
    <symbol id="i-wind" viewBox="0 0 24 24"><path d="M2 8h13c7 0 5-9 1-5M2 12h17M2 16h11c6 0 5 7 1 5"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><path d="M3 21V13h3v8m4 0V7h3v14m4 0V3h3v18"/></symbol>
    <symbol id="i-land" viewBox="0 0 24 24"><path d="m2 17 6-9 5 7 3-5 6 9M3 22h18M18 3v5m-2-3h4"/></symbol>
    <symbol id="i-mountain" viewBox="0 0 48 32"><path d="M2 26 14 7l8 12 8-16 16 23M1 31h46"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M4 9a9 9 0 1 1 0 8M4 3v6h6"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
  </defs></svg>
  <header class="topbar">
    <a class="brand" href="../"><svg><use href="#i-mountain"/></svg>MineScope<span>.</span></a>
    <div class="partners"><span>CityScope</span><img src="../assets/city-science.svg" alt="MIT City Science"><img src="../assets/mit-media-lab.svg" alt="MIT Media Lab"></div>
    <span class="location">Dominga · La Higuera, Chile</span>
    <span id="table-link-status" class="table-link-status" role="status" aria-live="polite" aria-atomic="true" data-status="key-required" title="The physical table server needs a session API key.">WebSocket · Key needed</span>
    <div class="unity-status" id="unity-status" role="status" hidden><i></i><span>API key missing</span></div>
    <a class="button map-link" href="../">Project map ↗</a>
    <button class="button" id="reset" aria-label="Reset scenario"><svg><use href="#i-rotate"/></svg><span>Reset</span></button>
    <button class="button" id="fullscreen" aria-label="Enter full screen"><svg><use href="#i-expand"/></svg><span>Full screen</span></button>
  </header>
  <main>
    <section class="model-stage" id="model-stage" aria-label="Interactive 3D printed terrain model and live display">
    <section class="metrics-panel" id="physical-display" aria-label="Scenario indicators on the table display">
      <div class="metrics-heading"><div><span class="eyebrow">YOUR SCENARIO</span><button class="live-state" id="live-state" aria-live="polite"><i></i><span>Candidate site</span></button></div><div class="metrics-actions"><button class="button" id="compare"><svg><use href="#i-monitor"/></svg>Compare El Negrillo</button></div></div>
      <div class="metrics-grid" id="metrics"></div>
      <div class="screen-legend" aria-label="Projected impact legend"><span><i style="--color:#E08063"></i>Pollution</span><span><i style="--color:#E9BB63"></i>Dust</span><span><i style="--color:#a9bafa"></i>Noise</span><span><i class="area-legend" style="--color:#3d977b"></i>Protected areas</span><span><i class="area-legend land-legend" style="--color:#b88e49"></i>Productive land</span><span><i class="protection-legend"></i>Protection</span></div>
    </section>
      <div class="loading" id="loading" role="status"><span class="spinner"></span>Preparing the terrain…</div>
      <canvas id="terrain-canvas" aria-label="3D terrain. Drag the amber tailings piece, or select a piece and use the arrow keys. Drag empty terrain to look from side to side; scroll to zoom."></canvas>
      <div id="model-labels" class="model-labels"></div>
      <div class="stage-bottom"><div class="stage-readout"><button id="pipeline-detail" class="pipeline-badge">Pipeline <strong id="pipeline-km">— km</strong> ↗</button><button class="pipeline-badge geography-badge" id="geography-detail" aria-label="Study area and data sources">Geography ↗</button></div><div class="view-tools" role="group" aria-label="Model view"><button id="rotate-view" class="button" aria-label="Rotate view left and right" aria-pressed="false"><svg><use href="#i-rotate"/></svg>Rotate</button><button id="zoom-in" class="button" aria-label="Zoom in">＋</button><button id="zoom-out" class="button" aria-label="Zoom out">−</button><button id="layers" class="button" aria-expanded="false">Layers ▱</button></div></div>
      <div id="layer-menu" class="layer-menu" hidden><strong>Projected layers</strong><label><input type="checkbox" data-layer="protection" checked>Protections</label><label><input type="checkbox" data-layer="pollution" checked>Water pollution</label><label><input type="checkbox" data-layer="dust" checked>Dust</label><label><input type="checkbox" data-layer="noise" checked>Noise</label><label><input type="checkbox" data-layer="water" checked>Watercourses</label><label><input type="checkbox" data-layer="catchments" checked>Catchments</label><label><input type="checkbox" data-layer="habitat" checked>Protected areas</label><label><input type="checkbox" data-layer="communities" checked>Communities</label><label><input type="checkbox" data-layer="pipeline" checked>Pipeline</label><label><input type="checkbox" data-layer="land" checked>Productive land</label></div>
    </section>
    <section class="intervention-panel" aria-label="Fund allocations"><div class="tray-heading"><div class="tray-title"><span class="eyebrow">ALLOCATE TO PROTECTION</span><button type="button" class="protection-info" id="protection-info" aria-label="About protections" title="About protections" aria-haspopup="dialog" aria-controls="detail-dialog"><svg aria-hidden="true"><use href="#i-info"/></svg></button></div><span id="token-count"></span></div><div class="token-tray" id="token-tray"></div></section>
  </main>
  <dialog id="detail-dialog" aria-labelledby="detail-title"><button class="close-dialog" aria-label="Close dialog">×</button><div id="detail-content"></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript>This scenario table needs JavaScript. <a href="../">Open the project map</a>.</noscript>
</body>
</html>
